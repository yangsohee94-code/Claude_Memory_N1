name: 자동 블로그 발행 (스케줄)
on:
  schedule:
    # 하루 2회 자동 실행 → 카테고리 3개 × 2회 = 6개/일
    # 1회차: 09:00 KST (00:00 UTC) — 실제 발행은 일별 오프셋 + 카테고리 딜레이로 분산
    - cron: '0 0 * * *'
    # 2회차: 19:00 KST (10:00 UTC)
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: "카테고리 (all = 3개 동시 발행)"
        required: true
        default: "all"
        type: choice
        options: [all, entertainment, car, health]
      topic:
        description: "주제 또는 날짜_슬롯 (예: 20260820_3)"
        required: false
        type: string
      wp_category_id:
        description: "WordPress 서브카테고리 ID (예: 43=드라마, 44=연예, 47=다이어트, 48=건강정보, 29=자동차) — 비우면 기본값 사용"
        required: false
        type: string

jobs:
  determine-categories:
    runs-on: ubuntu-latest
    outputs:
      categories: ${{ steps.set.outputs.categories }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.category }}" = "all" ]; then
            echo 'categories=["entertainment","car","health"]' >> $GITHUB_OUTPUT
          else
            echo 'categories=["${{ inputs.category }}"]' >> $GITHUB_OUTPUT
          fi

  publish:
    needs: determine-categories
    runs-on: ubuntu-latest
    strategy:
      matrix:
        category: ${{ fromJson(needs.determine-categories.outputs.categories) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 발행 시간 분산 (일별 + 카테고리별)
        run: |
          # ── 1단계: 일별 오프셋 (매일 5분씩 다른 시간에 발행)
          # 연중 몇 번째 날인지로 오프셋 계산 → 12일 주기로 0~55분 순환
          # 예: 1일=5분, 2일=10분 ... 12일=0분 → 반복 (7일 주기와 겹치지 않음)
          DAY_OF_YEAR=$(date +%j)
          DAILY_OFFSET=$(( (10#$DAY_OF_YEAR * 5) % 60 ))
          echo "📅 일별 오프셋: ${DAILY_OFFSET}분 (연중 ${DAY_OF_YEAR}일차)"
          sleep $((DAILY_OFFSET * 60))

          # ── 2단계: 카테고리별 간격 (3개 계정 동시 발행 방지)
          if [ "${{ matrix.category }}" = "car" ]; then
            DELAY=$((RANDOM % 600 + 600))   # 10~20분 후 시작
            echo "⏱️ car: ${DELAY}초 대기"
            sleep $DELAY
          elif [ "${{ matrix.category }}" = "health" ]; then
            DELAY=$((RANDOM % 600 + 1200))  # 20~30분 후 시작
            echo "⏱️ health: ${DELAY}초 대기"
            sleep $DELAY
          else
            echo "⏱️ entertainment: 일별 오프셋만 적용"
          fi
      - name: 패키지 설치
        run: pip install anthropic requests python-dotenv google-api-python-client google-auth playwright
      - name: Playwright Chromium 설치
        run: python -m playwright install chromium --with-deps
      - name: 글 생성 → WordPress + 네이버 발행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_CAT_ENTERTAINMENT_POP: ${{ secrets.WP_CAT_ENTERTAINMENT_POP }}
          WP_CAT_ENTERTAINMENT_DRAMA: ${{ secrets.WP_CAT_ENTERTAINMENT_DRAMA }}
          WP_CAT_CAR: ${{ secrets.WP_CAT_CAR }}
          WP_CAT_HEALTH_DIET: ${{ secrets.WP_CAT_HEALTH_DIET }}
          WP_CAT_HEALTH_INFO: ${{ secrets.WP_CAT_HEALTH_INFO }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
          CATEGORY: ${{ matrix.category }}
          TOPIC: ${{ inputs.topic || '' }}
          WP_CATEGORY_ID: ${{ inputs.wp_category_id || '' }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          # 네이버 카테고리별 계정 (형식: 아이디|비밀번호|블로그카테고리명)
          NAVER_ACCOUNT_entertainment: ${{ secrets.NAVER_ACCOUNT_ENTERTAINMENT }}
          NAVER_ACCOUNT_health: ${{ secrets.NAVER_ACCOUNT_HEALTH }}
          NAVER_ACCOUNT_car: ${{ secrets.NAVER_ACCOUNT_CAR }}
          # 네이버 카테고리별 쿠키 (JSON array)
          NAVER_COOKIES_entertainment: ${{ secrets.NAVER_COOKIES_ENTERTAINMENT }}
          NAVER_COOKIES_health: ${{ secrets.NAVER_COOKIES_HEALTH }}
          NAVER_COOKIES_car: ${{ secrets.NAVER_COOKIES_CAR }}
        run: python3 auto_blog.py
